<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portail Applications</title>

<!-- Configuration PWA & Icônes -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4285f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="logo192.png">
<link rel="icon" type="image/png" href="logo192.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      margin-top: 40px;
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin: 0;
      color: #444;
    }
    
    p {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
    }

    /* Conteneur des boutons */
    .menu-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90%;
      max-width: 400px;
    }

    /* Le style des boutons */
    .app-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-decoration: none;
      color: #333;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #eee;
    }

    .app-card:active {
      transform: scale(0.98);
      background-color: #fafafa;
    }

    /* Icône emoji ou image à gauche du bouton */
    .icon-box {
      width: 50px;
      height: 50px;
      background-color: #fbbc05; /* Jaune Google */
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      margin-right: 15px;
      color: white;
    }
    
    /* Variante de couleur pour d'autres apps */
    .icon-blue { background-color: #4285f4; }
    .icon-green { background-color: #34a853; }

    .text-box h2 {
      margin: 0;
      font-size: 18px;
    }
    
    .text-box span {
      font-size: 13px;
      color: #666;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      font-size: 12px;
      color: #999;
    }
      /* Message d'aide pour l'installation (visible seulement si besoin) */
    .install-hint {
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.7;
      border: 2px dashed rgba(6, 30, 243, 0.973);
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portail Applications</h1>
    <p>enerjtech.com</p>
  </header>

  <div class="menu-grid">

    <a href="Materiel/index.html" class="app-card">
      <div class="icon-box">🧰</div> <div class="text-box">
        <h2>Matériel</h2>
        <span>Inventaire et suivis</span>
      </div>
    </a>

    <a href="stock/index.html" class="app-card">
      <div class="icon-box icon-blue">📦</div> <div class="text-box">
        <h2>Stock</h2>
        <span>Gestions du Stock</span>
      </div>
    </a>

  </div>

  <div class="install-hint">
    Pour installer le Portail :<br>
    Menu du navigateur > <strong>Ajouter à l'écran d'accueil</strong>
  </div>

  <footer>
    © Ener'J Tech
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    }
  </script>

</body>
</html>
